services:
  cv:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Port hôte fixe : l'URL reste identique à chaque build/redéploiement.
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
