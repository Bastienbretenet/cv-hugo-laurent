services:
  cv:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # Dev : tout le projet est monté comme racine web. Un simple refresh
      # suffit après une modification, aucun rebuild n'est nécessaire.
      #
      # On monte le dossier entier et non chaque fichier : un bind mount sur un
      # fichier suit son inode, or la plupart des éditeurs remplacent le fichier
      # au lieu de l'écrire en place — le conteneur continuerait alors de servir
      # l'ancienne version.
      - .:/usr/share/nginx/html:ro
      # Le listing JSON du dossier galerie est servi via cette config.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Port hôte fixe : l'URL reste identique à chaque build/redéploiement.
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
