server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # ---------------------------------------------------------------
    # Ordre important : nginx retient le PREMIER emplacement regex qui
    # correspond. Les refus doivent donc précéder les règles de cache.
    # ---------------------------------------------------------------

    # En dev, la racine web est le dossier du projet : on masque ce qui n'a
    # rien à y faire (config, scripts, historique git).
    location ~ ^/(\.git|scripts/|nginx\.conf|Dockerfile|docker-compose|Makefile|prompt\.md) {
        return 404;
    }

    # Les originaux pèsent plus de 100 Mo : seules les versions optimisées
    # du sous-dossier opt/ sont servies.
    location ~* ^/assets/gallery/[^/]+\.(png|jpe?g|tiff?|bmp|webp)$ {
        return 404;
    }

    # Le mur de photos se construit à partir de ce listing : déposer une image
    # dans assets/gallery/opt/ suffit, aucune modification de code n'est requise.
    location = /assets/gallery/opt/ {
        autoindex        on;
        autoindex_format json;
        autoindex_exact_size off;
        autoindex_localtime  on;
    }

    # Les images optimisées ne changent pas : cache long côté navigateur.
    location ~* ^/assets/.*\.(jpg|jpeg|png|webp|avif|ico|svg)$ {
        expires   30d;
        add_header Cache-Control "public";
    }

    # Les pages HTML doivent toujours refléter le fichier courant.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
